# Pipeline configuration. Edit this to steer what gets scanned, generated,
# and how strict the compliance/quality gates are.

niche: kids_content

# --- Stage 1: trend scanner ---
trend_scanner:
  # Search terms used against the YouTube Data API to find currently-performing
  # videos in the niche. Keep these broad-but-relevant; the scorer below ranks
  # results, it doesn't just take everything.
  search_queries:
    - "nursery rhymes for toddlers"
    - "kids animated story"
    - "learning colors for kids"
    - "counting song for toddlers"
    - "bedtime story animation"
  # Only consider channels/videos explicitly marked for kids by YouTube
  # (safer for legal/compliance signal and closer to what we intend to publish).
  restrict_to_made_for_kids: true
  # Only look at videos published in the last N days, so "viral" means
  # "currently working", not "viral in 2016".
  published_within_days: 21
  max_results_per_query: 25
  # Minimum view velocity (views / day since published) to be worth surfacing.
  min_view_velocity: 2000

# --- Stage 2: ideation (LLM) ---
ideation:
  model: claude-sonnet-5
  concepts_per_run: 5
  # How many previously-generated titles to remind the model to avoid
  # repeating (reduces near-duplicate concepts showing up in the review
  # queue run after run). 0 disables the check.
  avoid_repeating_last_n_titles: 30
  # Style/safety guardrails injected into every ideation prompt. These exist
  # to keep output as ORIGINAL animated content inspired by trend patterns
  # (topics, pacing, structure) rather than reproductions of any specific
  # video, and to keep it clearly cartoon/animated rather than photoreal
  # depictions of real-looking children.
  style_guardrails:
    - "Output must be a wholly original story, characters, and script — never reuse another creator's title, character names, or specific plot."
    - "Visual style must be stylized/cartoon animation, never photorealistic renderings of human children."
    - "No real people, brands, or copyrighted characters."
    - "Content must be non-violent, non-scary, and age-appropriate for under-8s."
    - "No dialogue or imagery implying the video was made by a real on-screen host or creator."
    - "Do not invent a recurring host/narrator character in scenes — the channel already has a mascot (composited in separately at intro/transitions/outro). Keep scene visual_prompts focused purely on the theme's subject matter (the animals, colors, shapes, etc.), not a character presenting it."

# --- Stage 3: video generation ---
video_generation:
  provider: mock # mock | runway | pika -- overridden by VIDEO_PROVIDER env var if set
  target_duration_seconds: 60
  scenes_per_video: 6
  resolution: "1080x1920" # vertical, works for Shorts + regular uploads
  # Hard cap on how many videos one `generate` run will produce, independent
  # of how many concepts stage 2 ideated -- a spend/runaway-cost guardrail
  # for unattended runs. null = generate everything in the concepts file.
  max_videos_per_run: 6
  music:
    dir: assets/music
    license_notes: "Only place music here that you have a license to use commercially (royalty-free library with a commercial/YouTube license, or fully AI-generated/owned). See assets/music/README.md."

# Recurring channel mascot. Appears as a standalone bumper at the very start
# and end of each video, plus a brief corner pop-in between scenes -- it's a
# signature, not the star: scene content (video_generation above) is theme-
# driven and never depends on the mascot appearing in it.
#
# Assets are pre-generated ONCE via `python scripts/generate_mascot_assets.py`
# (see assets/mascot/DESIGN_BRIEF.md) and then reused across every video via
# ffmpeg compositing -- this sidesteps text-to-video models' weak character
# consistency across independently-generated clips, and is far cheaper than
# regenerating the mascot per video.
mascot:
  enabled: true
  name: "Puff" # placeholder -- rename freely; nothing else keys off this string
  visual_description: >
    A small round bouncy forest creature: single warm gold-orange fluffy
    body with a dandelion-puff texture, big simple white eyes with black
    pupils, no clothing or props, tiny springy feet. Flat 2.5D storybook
    style, bold clean linework, flat color fills -- simple enough as a
    silhouette to work as a sticker or small icon.
  assets_dir: assets/mascot
  bumper_background: "a soft solid warm-cream pastel background, simple and uncluttered, no other elements"
  chroma_key_color: "0x00FF00"
  reaction_position: top_right # top_right | top_left | bottom_right | bottom_left -- avoid bottom, captions live there
  reaction_size_pct: 30 # reaction clip rendered at this % of frame width when overlaid
  clips:
    bounce_in:
      prompt_suffix: "Puff springs energetically into frame from off-screen, lands with a little bounce, and looks at the camera with a big cheerful smile, ready to introduce today's video."
      duration_seconds: 2.5
      composited: false # standalone bumper clip, prepended as-is
    reaction:
      prompt_suffix: "Puff pops up and does one quick delighted bounce-in-place cheer, like reacting to something wonderful, then holds a happy pose."
      duration_seconds: 1.5
      composited: true # rendered on a chroma-key background and overlaid on top of scene content
    bounce_out:
      prompt_suffix: "Puff gives a friendly wave, then springs back off-screen the way it came, bye for now."
      duration_seconds: 2.0
      composited: false # standalone bumper clip, appended as-is

# --- Stage 4: human review ---
review:
  queue_dir: data/review_queue
  approved_dir: data/approved
  # Nothing in review/ ever auto-progresses to upload; approve_video() must
  # be called explicitly (via the CLI) for each item.

# --- Stage 5: upload ---
upload:
  privacy_status: private # private | unlisted | public — start private, promote manually until you trust the pipeline
  made_for_kids: true
  category_id: "1" # Film & Animation; change per Google's category list if needed
  uploaded_dir: data/uploaded
