services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_NUM_PARALLEL=1       # explicit; prevents VRAM overcommit
      - OLLAMA_MAX_LOADED_MODELS=1  # one model in VRAM at a time; prevents fragmentation
      - OLLAMA_MAX_QUEUE=20         # fail fast rather than queue indefinitely
      - OLLAMA_KEEP_ALIVE=5m        # unload idle model after 5 min; reclaims VRAM between sessions
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    depends_on:
      - ollama
    ports:
      - "3000:8080"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
      # Google OAuth — leave blank to disable, see README for setup instructions
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - ENABLE_OAUTH_SIGNUP=${ENABLE_OAUTH_SIGNUP:-false}
      - DEFAULT_USER_ROLE=user
      # Memory on by default — users can disable in Settings → Personalization → Memory
      - ENABLE_MEMORY_INJECTION=True
    volumes:
      - webui_data:/app/backend/data
    restart: unless-stopped

  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      - SEARXNG_SECRET_KEY=${SEARXNG_SECRET_KEY}
    restart: unless-stopped
    # No external port — only open-webui needs to reach it internally

  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    restart: unless-stopped

  # ── SGLang — swap in when agents/home-automation integration needs more throughput ──
  # SGLang replaces Ollama as the inference backend. Open WebUI and Home Assistant
  # point to its OpenAI-compatible API on port 30000 instead of Ollama's 11434.
  #
  # IMPORTANT: SGLang uses HuggingFace safetensors format, NOT Ollama's GGUF models.
  # Download a model first:
  #   docker run --rm -v sglang_models:/models huggingface/transformers-cli \
  #     download meta-llama/Meta-Llama-3.1-8B-Instruct --local-dir /models/llama3.1-8b
  #
  # When to switch: multiple concurrent agent runs, home automation hitting the API
  # repeatedly, or tool calls returning malformed JSON. SGLang's prefix caching and
  # enforced structured outputs solve all three.
  #
  # sglang:
  #   image: lmsysorg/sglang:latest
  #   container_name: sglang
  #   volumes:
  #     - sglang_models:/models
  #   ports:
  #     - "30000:30000"
  #   environment:
  #     - CUDA_VISIBLE_DEVICES=0
  #   command: >
  #     python -m sglang.launch_server
  #     --model-path /models/llama3.1-8b
  #     --host 0.0.0.0
  #     --port 30000
  #     --mem-fraction-static 0.85
  #     --enable-torch-compile
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: all
  #             capabilities: [gpu]
  #   restart: unless-stopped

  # Cloudflare Tunnel — uncomment and set CLOUDFLARE_TUNNEL_TOKEN in .env for school access
  # cloudflared:
  #   image: cloudflare/cloudflared:latest
  #   container_name: cloudflared
  #   command: tunnel --no-autoupdate run
  #   environment:
  #     - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
  #   depends_on:
  #     - open-webui
  #   restart: unless-stopped

volumes:
  ollama_data:
  webui_data:
  portainer_data:
  sglang_models:  # pre-created; only used if SGLang service is uncommented
