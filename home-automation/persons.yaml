# Home Assistant Person Configuration
# Reference in configuration.yaml with:  person: !include persons.yaml
#
# Each person aggregates one or more device_trackers.
# The HA Companion app (iOS/Android) auto-creates a device_tracker when
# you log in — replace the entity IDs below with the real ones after setup.
#
# Companion app location settings to tune:
#   Settings → Companion App → Location → Background refresh: Always
#   Settings → Companion App → Location → Significant location change: ON

- name: Alice
  id: alice
  device_trackers:
    - device_tracker.alice_phone   # created by HA Companion app on Alice's phone

- name: Bob
  id: bob
  device_trackers:
    - device_tracker.bob_phone     # created by HA Companion app on Bob's phone

# ── Kids ──────────────────────────────────────────────────────────────────────
# Uni student — ground floor Bed 5, her own zone
# Her phone presence drives lighting in her area (not school calendar)
- name: Uni Student
  id: uni_student
  device_trackers:
    - device_tracker.uni_student_phone

# School kids — first floor Beds 2, 3, 4
# School calendar + time drives their lighting automations
# Rename to real names after setup (id must stay as kid_1/2/3 to match automations)
- name: Kid 1
  id: kid_1
  device_trackers:
    - device_tracker.kid_1_phone   # add if they have a phone; leave empty otherwise

- name: Kid 2
  id: kid_2
  device_trackers:
    - device_tracker.kid_2_phone

- name: Kid 3
  id: kid_3
  device_trackers:
    - device_tracker.kid_3_phone
