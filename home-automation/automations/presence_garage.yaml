# Garage door — presence-based automations
# Entity assumptions:
#   cover.garage_door     — ratgdo integration (open/close/state)
#   person.andrew          — HA Companion app tracker
#   person.jessica            — HA Companion app tracker
#
# Add to configuration.yaml:
#   automation: !include_dir_merge_list automations/

# ── Arrival: open garage when a household member enters the Home zone ─────────

- alias: "Garage - Open on arrival (Andrew)"
  id: garage_open_on_arrival_andrew
  trigger:
    - platform: zone
      entity_id: person.andrew
      zone: zone.home
      event: enter
  condition:
    - condition: state
      entity_id: input_boolean.arrival_automations_enabled
      state: "on"
    - condition: state
      entity_id: input_boolean.andrew_was_away
      state: "on"
    - condition: state
      entity_id: cover.garage_door
      state: "closed"
    - condition: time
      after: "06:30:00"
      before: "22:30:00"
  action:
    - service: cover.open_cover
      target:
        entity_id: cover.garage_door
    - service: input_boolean.turn_off
      target:
        entity_id: input_boolean.andrew_was_away
    - service: notify.notify
      data:
        title: "🏠 Welcome home, Andrew"
        message: "Garage door opened."

- alias: "Garage - Open on arrival (Jessica)"
  id: garage_open_on_arrival_jessica
  trigger:
    - platform: zone
      entity_id: person.jessica
      zone: zone.home
      event: enter
  condition:
    - condition: state
      entity_id: input_boolean.arrival_automations_enabled
      state: "on"
    - condition: state
      entity_id: input_boolean.jessica_was_away
      state: "on"
    - condition: state
      entity_id: cover.garage_door
      state: "closed"
    - condition: time
      after: "06:30:00"
      before: "22:30:00"
  action:
    - service: cover.open_cover
      target:
        entity_id: cover.garage_door
    - service: input_boolean.turn_off
      target:
        entity_id: input_boolean.jessica_was_away
    - service: notify.notify
      data:
        title: "🏠 Welcome home, Jessica"
        message: "Garage door opened."

# ── Departure: track when people leave so arrival trigger is guarded ──────────

- alias: "Garage - Mark Andrew as away on departure"
  id: garage_mark_andrew_away
  trigger:
    - platform: zone
      entity_id: person.andrew
      zone: zone.home
      event: leave
  action:
    - service: input_boolean.turn_on
      target:
        entity_id: input_boolean.andrew_was_away

- alias: "Garage - Mark Jessica as away on departure"
  id: garage_mark_jessica_away
  trigger:
    - platform: zone
      entity_id: person.jessica
      zone: zone.home
      event: leave
  action:
    - service: input_boolean.turn_on
      target:
        entity_id: input_boolean.jessica_was_away

# ── Safety: close garage if left open and everyone is away ───────────────────

- alias: "Garage - Close if open and everyone away for 10 minutes"
  id: garage_close_when_all_away
  trigger:
    - platform: state
      entity_id: cover.garage_door
      to: "open"
      for: "00:10:00"
  condition:
    - condition: state
      entity_id: person.andrew
      state: "not_home"
    - condition: state
      entity_id: person.jessica
      state: "not_home"
  action:
    - service: cover.close_cover
      target:
        entity_id: cover.garage_door
    - service: notify.notify
      data:
        title: "⚠️ Garage auto-closed"
        message: "Garage was open with nobody home — closed automatically."
