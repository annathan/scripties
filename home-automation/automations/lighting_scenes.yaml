# Lighting — Whole-house scene automations
# Covers: morning ramp, daytime, evening wind-down, movie mode, bedtime,
# study mode, all-off when away, and colour party.
#
# Room entities (rename in HA after pairing Zigbee dimmers via ZHA):
#
# Ground floor dimmers:
#   light.entry_dimmer, light.kitchen_dimmer, light.family_dimmer,
#   light.dining_dimmer, light.study_dimmer, light.bed_5_dimmer,
#   light.ground_floor_bathroom_dimmer
#
# First floor dimmers:
#   light.staircase_dimmer, light.landing_dimmer, light.master_dimmer,
#   light.master_ensuite_dimmer, light.bed_2_dimmer, light.bed_3_dimmer,
#   light.bed_4_dimmer, light.bathroom_first_floor_dimmer, light.retreat_dimmer
#
# Hue colour bulbs (in lamps — separate from dimmers):
#   light.bed_2_lamp, light.bed_3_lamp, light.bed_4_lamp, light.bed_5_lamp,
#   light.retreat_lamp_1, light.retreat_lamp_2,
#   light.family_lamp_1, light.family_lamp_2, light.tv_lightstrip

# ── Morning: kitchen + hallways on before everyone wakes ─────────────────────

- alias: "Lighting - Morning ramp (weekdays)"
  id: lighting_morning_ramp
  trigger:
    - platform: time
      at: "06:45:00"
  condition:
    - condition: template
      value_template: "{{ now().weekday() < 5 }}"
    - condition: or
      conditions:
        - condition: state
          entity_id: person.alice
          state: "home"
        - condition: state
          entity_id: person.bob
          state: "home"
  action:
    - service: light.turn_on
      target:
        entity_id:
          - light.kitchen_dimmer
          - light.landing_dimmer
          - light.staircase_dimmer
      data:
        brightness_pct: 40
        color_temp_kelvin: 2700
    - delay: "00:20:00"
    - service: light.turn_on
      target:
        entity_id:
          - light.kitchen_dimmer
          - light.family_dimmer
          - light.dining_dimmer
      data:
        brightness_pct: 100
        color_temp_kelvin: 4000

# ── Evening: warm wind-down at sunset ────────────────────────────────────────

- alias: "Lighting - Evening wind-down at sunset"
  id: lighting_evening_windown
  trigger:
    - platform: sun
      event: sunset
      offset: "-00:15:00"
  action:
    - service: light.turn_on
      target:
        entity_id:
          - light.kitchen_dimmer
          - light.family_dimmer
          - light.dining_dimmer
          - light.landing_dimmer
      data:
        brightness_pct: 70
        color_temp_kelvin: 2700
    - service: light.turn_on
      target:
        entity_id:
          - light.family_lamp_1
          - light.family_lamp_2
      data:
        brightness_pct: 60
        color_temp_kelvin: 2200

# ── Movie mode: dim living area, TV lightstrip on ────────────────────────────
# Triggered manually from dashboard or a physical Hue button.

- alias: "Lighting - Movie mode ON"
  id: lighting_movie_mode_on
  trigger:
    - platform: state
      entity_id: input_boolean.movie_mode
      to: "on"
  action:
    - service: light.turn_on
      target:
        entity_id: light.family_dimmer
      data:
        brightness_pct: 5
        color_temp_kelvin: 2200
    - service: light.turn_on
      target:
        entity_id:
          - light.family_lamp_1
          - light.family_lamp_2
      data:
        brightness_pct: 20
        rgb_color: [255, 100, 10]
    - service: light.turn_on
      target:
        entity_id: light.tv_lightstrip
      data:
        brightness_pct: 50
        color_temp_kelvin: 2700
    # Turn off other nearby lights
    - service: light.turn_off
      target:
        entity_id:
          - light.dining_dimmer
          - light.kitchen_dimmer

- alias: "Lighting - Movie mode OFF"
  id: lighting_movie_mode_off
  trigger:
    - platform: state
      entity_id: input_boolean.movie_mode
      to: "off"
  action:
    - service: light.turn_on
      target:
        entity_id:
          - light.family_dimmer
          - light.kitchen_dimmer
          - light.dining_dimmer
      data:
        brightness_pct: 70
        color_temp_kelvin: 2700
    - service: light.turn_off
      target:
        entity_id: light.tv_lightstrip

# ── Bedtime: kids rooms dim then off ─────────────────────────────────────────

- alias: "Lighting - Kids bedtime (weekdays)"
  id: lighting_kids_bedtime_weekday
  trigger:
    - platform: time
      at: "21:00:00"
  condition:
    - condition: template
      value_template: "{{ now().weekday() < 5 }}"
  action:
    - service: light.turn_on
      target:
        entity_id:
          - light.bed_2_lamp
          - light.bed_3_lamp
          - light.bed_4_lamp
      data:
        brightness_pct: 15
        rgb_color: [255, 50, 0]   # deep red — sleep-friendly
    - service: light.turn_off
      target:
        entity_id:
          - light.bed_2_dimmer
          - light.bed_3_dimmer
          - light.bed_4_dimmer
    - delay: "00:30:00"
    - service: light.turn_off
      target:
        entity_id:
          - light.bed_2_lamp
          - light.bed_3_lamp
          - light.bed_4_lamp

- alias: "Lighting - Kids bedtime (weekends)"
  id: lighting_kids_bedtime_weekend
  trigger:
    - platform: time
      at: "22:00:00"
  condition:
    - condition: template
      value_template: "{{ now().weekday() >= 5 }}"
  action:
    - service: light.turn_on
      target:
        entity_id:
          - light.bed_2_lamp
          - light.bed_3_lamp
          - light.bed_4_lamp
      data:
        brightness_pct: 15
        rgb_color: [255, 50, 0]
    - service: light.turn_off
      target:
        entity_id:
          - light.bed_2_dimmer
          - light.bed_3_dimmer
          - light.bed_4_dimmer
    - delay: "00:30:00"
    - service: light.turn_off
      target:
        entity_id:
          - light.bed_2_lamp
          - light.bed_3_lamp
          - light.bed_4_lamp

# ── All off when everyone leaves ─────────────────────────────────────────────

- alias: "Lighting - All interior lights off when house empty"
  id: lighting_all_off_when_away
  trigger:
    - platform: state
      entity_id: person.alice
      to: "not_home"
    - platform: state
      entity_id: person.bob
      to: "not_home"
  condition:
    - condition: state
      entity_id: person.alice
      state: "not_home"
    - condition: state
      entity_id: person.bob
      state: "not_home"
    - condition: state
      entity_id: person.uni_student
      state: "not_home"
    - condition: state
      entity_id: person.kid_1
      state: "not_home"
    - condition: state
      entity_id: person.kid_2
      state: "not_home"
    - condition: state
      entity_id: person.kid_3
      state: "not_home"
  action:
    - delay: "00:05:00"   # 5-minute grace period in case someone just stepped outside
    - service: light.turn_off
      target:
        entity_id: all
    - service: switch.turn_off
      target:
        entity_id:
          - switch.laundry_light
          - switch.garage_light_left
          - switch.garage_light_right

# ── Colour party mode (lounge + retreat) ─────────────────────────────────────

- alias: "Lighting - Colour party mode ON"
  id: lighting_colour_party_on
  trigger:
    - platform: state
      entity_id: input_boolean.colour_party_mode
      to: "on"
  action:
    - service: light.turn_on
      target:
        entity_id:
          - light.family_lamp_1
          - light.family_lamp_2
          - light.retreat_lamp_1
          - light.retreat_lamp_2
          - light.tv_lightstrip
      data:
        effect: "colorloop"
        brightness_pct: 80

- alias: "Lighting - Colour party mode OFF"
  id: lighting_colour_party_off
  trigger:
    - platform: state
      entity_id: input_boolean.colour_party_mode
      to: "off"
  action:
    - service: light.turn_on
      target:
        entity_id:
          - light.family_lamp_1
          - light.family_lamp_2
          - light.retreat_lamp_1
          - light.retreat_lamp_2
      data:
        brightness_pct: 70
        color_temp_kelvin: 2700
    - service: light.turn_off
      target:
        entity_id: light.tv_lightstrip
