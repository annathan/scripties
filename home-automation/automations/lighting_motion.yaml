      entity_id: binary_sensor.pir_master_ensuite
      to: "on"
  condition:
    - condition: state
      entity_id: light.master_ensuite_dimmer
      state: "off"
  action:
    - service: light.turn_on
      target:
        entity_id: light.master_ensuite_dimmer
      data:
        brightness_pct: "{{ 8 if now().hour >= 22 or now().hour < 6 else 90 }}"
        color_temp_kelvin: 2700

- alias: "Lighting - Master ensuite off (no motion 10 min)"
  id: lighting_master_ensuite_off
  trigger:
    - platform: state
      entity_id: binary_sensor.pir_master_ensuite
      to: "off"
      for: "00:10:00"
  action:
    - service: light.turn_off
