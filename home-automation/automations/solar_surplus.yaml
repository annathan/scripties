# Solar surplus routing automations — GoodWe GW5000-DNS-30
#
# Key GoodWe entities (verify names in your HA after integration setup):
#   sensor.goodwe_pv_power        — total solar production (W)
#   sensor.goodwe_grid_power      — positive = importing, negative = exporting (W)
#
# Surplus = how much you're currently exporting to the grid.
# These automations redirect that surplus into useful loads instead.
#
# Thresholds come from input_number helpers in packages/helpers.yaml so you can
# adjust them from the dashboard without touching this file. Triggers use
# platform: template to read those values dynamically.
#
# A 5-minute sustain period is required before acting to avoid cloud-flicker toggling.
# Each tier has ~200-300 W of hysteresis between the ON and OFF thresholds.
#
# Optional load entities (comment out anything you don't have yet):
#   switch.hot_water_boost           — Shelly 1 on immersion heater or heat pump
#   switch.pool_pump_high_speed      — ESPHome pool pump speed control
#   switch.ev_charger                — OCPP charger or simple Shelly on EVSE

# ── Template sensor: calculated surplus in watts ──────────────────────────────
# Add this block to a template.yaml or your packages/ directory.
# It inverts grid_power so positive = surplus being exported.
#
# template:
#   - sensor:
#       - name: "Solar Surplus"
#         unit_of_measurement: "W"
#         device_class: power
#         state: >
#           {% set grid = states('sensor.goodwe_grid_power') | float(0) %}
#           {{ [grid * -1, 0] | max | round(0) }}

# ── Tier 1: hot water boost ───────────────────────────────────────────────────
# ON when exporting more than solar_threshold_hot_water (default 1000 W).
# OFF when surplus drops 200 W below threshold (hysteresis).

- alias: "Solar - Enable hot water boost on surplus"
  id: solar_hot_water_boost_on
  trigger:
    - platform: template
      value_template: >
        {{ states('sensor.goodwe_grid_power') | float(0) <
           (states('input_number.solar_threshold_hot_water') | float(1000)) * -1 }}
      for: "00:05:00"
  condition:
    - condition: state
      entity_id: input_boolean.solar_surplus_automations_enabled
      state: "on"
    - condition: state
      entity_id: switch.hot_water_boost
      state: "off"
    - condition: time
      after: "07:00:00"
      before: "16:00:00"
  action:
    - service: switch.turn_on
      target:
        entity_id: switch.hot_water_boost
    - service: notify.notify
      data:
        title: "☀️ Hot water boost ON"
        message: >
          Solar surplus over {{ states('input_number.solar_threshold_hot_water') | int }} W
          — boosting hot water.
          Currently producing {{ states('sensor.goodwe_pv_power') }} W.

- alias: "Solar - Disable hot water boost when surplus drops"
  id: solar_hot_water_boost_off
  trigger:
    - platform: template
      value_template: >
        {{ states('sensor.goodwe_grid_power') | float(0) >
           (states('input_number.solar_threshold_hot_water') | float(1000)) * -1 + 200 }}
      for: "00:05:00"
  condition:
    - condition: state
      entity_id: switch.hot_water_boost
      state: "on"
  action:
    - service: switch.turn_off
      target:
        entity_id: switch.hot_water_boost
    - service: notify.notify
      data:
        title: "☁️ Hot water boost OFF"
        message: "Solar surplus dropped — hot water boost turned off."

# ── Tier 2: pool pump high speed ─────────────────────────────────────────────
# ON when exporting more than solar_threshold_pool_pump (default 2000 W).
# OFF when surplus drops 300 W below threshold (hysteresis).

- alias: "Solar - Run pool pump at full speed on surplus"
  id: solar_pool_pump_high_on
  trigger:
    - platform: template
      value_template: >
        {{ states('sensor.goodwe_grid_power') | float(0) <
           (states('input_number.solar_threshold_pool_pump') | float(2000)) * -1 }}
      for: "00:05:00"
  condition:
    - condition: state
      entity_id: input_boolean.solar_surplus_automations_enabled
      state: "on"
    - condition: state
      entity_id: switch.pool_pump_high_speed
      state: "off"
    - condition: time
      after: "07:00:00"
      before: "16:00:00"
  action:
    - service: switch.turn_on
      target:
        entity_id: switch.pool_pump_high_speed
    - service: notify.notify
      data:
        title: "☀️ Pool pump — full speed"
        message: >
          Solar surplus over {{ states('input_number.solar_threshold_pool_pump') | int }} W
          — running pool pump at full speed.

- alias: "Solar - Return pool pump to normal speed when surplus drops"
  id: solar_pool_pump_high_off
  trigger:
    - platform: template
      value_template: >
        {{ states('sensor.goodwe_grid_power') | float(0) >
           (states('input_number.solar_threshold_pool_pump') | float(2000)) * -1 + 300 }}
      for: "00:05:00"
  condition:
    - condition: state
      entity_id: switch.pool_pump_high_speed
      state: "on"
  action:
    - service: switch.turn_off
      target:
        entity_id: switch.pool_pump_high_speed

# ── Tier 3: EV charger ────────────────────────────────────────────────────────
# ON when exporting more than solar_threshold_ev (default 3000 W).
# OFF when surplus drops 300 W below threshold (hysteresis).
#
# Two options — pick one:
#   A. Simple on/off (Shelly on EVSE): uncomment switch.turn_on block
#   B. OCPP charger (Wallbox, Easee): set charging current via number.set_value
#
# This automation notifies first so you can decide whether to plug in.
# Remove the notify action and uncomment the switch/OCPP block for fully automatic.

- alias: "Solar - Notify EV surplus available"
  id: solar_ev_surplus_notify
  trigger:
    - platform: template
      value_template: >
        {{ states('sensor.goodwe_grid_power') | float(0) <
           (states('input_number.solar_threshold_ev') | float(3000)) * -1 }}
      for: "00:05:00"
  condition:
    - condition: state
      entity_id: input_boolean.solar_surplus_automations_enabled
      state: "on"
    - condition: time
      after: "07:00:00"
      before: "16:00:00"
  action:
    - service: notify.notify
      data:
        title: "⚡ EV surplus available"
        message: >
          Solar exporting over {{ states('input_number.solar_threshold_ev') | int }} W to the grid.
          Good time to plug in the car.
          Production: {{ states('sensor.goodwe_pv_power') }} W

    # Option A — uncomment to auto-enable a simple EVSE switch:
    # - service: switch.turn_on
    #   target:
    #     entity_id: switch.ev_charger

    # Option B — uncomment for OCPP charger current control (e.g. Wallbox):
    # - service: number.set_value
    #   target:
    #     entity_id: number.ev_charger_current
    #   data:
    #     value: >
    #       {% set surplus_w = (states('sensor.goodwe_grid_power') | float * -1) %}
    #       {{ [[(surplus_w / 230) | int, 6] | max, 16] | min }}

- alias: "Solar - Stop EV charging when surplus drops"
  id: solar_ev_surplus_off
  trigger:
    - platform: template
      value_template: >
        {{ states('sensor.goodwe_grid_power') | float(0) >
           (states('input_number.solar_threshold_ev') | float(3000)) * -1 + 300 }}
      for: "00:05:00"
  condition:
    - condition: state
      entity_id: switch.ev_charger
      state: "on"
  action:
    - service: switch.turn_off
      target:
        entity_id: switch.ev_charger
    - service: notify.notify
      data:
        title: "⚡ EV charging paused"
        message: "Solar surplus dropped below threshold — EV charger paused."

# ── Evening: ensure all surplus loads are off after solar drops ───────────────

- alias: "Solar - Turn off all surplus loads at sunset"
  id: solar_surplus_loads_off_at_sunset
  trigger:
    - platform: sun
      event: sunset
      offset: "-00:30:00"
  action:
    - service: switch.turn_off
      target:
        entity_id:
          - switch.hot_water_boost
          - switch.pool_pump_high_speed
          - switch.ev_charger

# ── Appliance monitoring: washing machine / dryer done notification ───────────
# Requires a Zigbee/WiFi smart plug with power monitoring on each appliance.
# Entity: sensor.washing_machine_power (W)
#
# Two-step approach: track running state with input_boolean.washing_machine_running.
# This avoids the race condition where the trigger fires (power already < 5W) and
# the condition tries to check the current sensor value — which always fails.

- alias: "Appliance - Washing machine started"
  id: appliance_washing_machine_started
  trigger:
    - platform: numeric_state
      entity_id: sensor.washing_machine_power
      above: 20
      for: "00:01:00"
  condition:
    - condition: state
      entity_id: input_boolean.washing_machine_running
      state: "off"
  action:
    - service: input_boolean.turn_on
      target:
        entity_id: input_boolean.washing_machine_running

- alias: "Appliance - Washing machine finished"
  id: appliance_washing_machine_done
  trigger:
    - platform: numeric_state
      entity_id: sensor.washing_machine_power
      below: 5
      for: "00:02:00"
  condition:
    - condition: state
      entity_id: input_boolean.washing_machine_running
      state: "on"
  action:
    - service: input_boolean.turn_off
      target:
        entity_id: input_boolean.washing_machine_running
    - service: notify.notify
      data:
        title: "🧺 Washing done"
        message: "The washing machine has finished its cycle."

- alias: "Appliance - Dryer finished"
  id: appliance_dryer_done
  trigger:
    - platform: numeric_state
      entity_id: sensor.dryer_power
      below: 5
      for: "00:02:00"
  action:
    - service: notify.notify
      data:
        title: "👕 Dryer done"
        message: "The dryer has finished."
